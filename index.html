<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A5C51" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="四级随身练：在手机上背单词、练听力、做测验与拼写。进度保存在本机，无需登录。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="随身练" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>四级随身练</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <div id="boot" class="boot" role="status">
      <div class="boot-mark" aria-hidden="true">四</div>
      <p class="boot-title">四级随身练</p>
      <p class="boot-sub" id="boot-sub">正在打开词库…</p>
    </div>
    <main id="view" class="view" hidden></main>
    <nav id="tabbar" class="tabbar" hidden aria-label="主导航">
      <button type="button" class="tab" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.2 12 4.8l7.5 6.4v8.3a1.2 1.2 0 0 1-1.2 1.2H5.7a1.2 1.2 0 0 1-1.2-1.2v-8.3Z"/><path d="M9.5 20.7v-6.2h5v6.2"/></svg>
        <span>首页</span>
      </button>
      <button type="button" class="tab" data-nav="study">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4.5" width="14" height="15" rx="2"/><path d="M8.5 9h7M8.5 12.5h7M8.5 16h4.5"/></svg>
        <span>学习</span>
      </button>
      <button type="button" class="tab" data-nav="listen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 8.2 6.8 11H4.6a1 1 0 0 0-1 1v1.8a1 1 0 0 0 1 1h2.2L10 17.6V8.2Z"/><path d="M14.2 9.2a4.2 4.2 0 0 1 0 5.6M16.8 7a7 7 0 0 1 0 10"/></svg>
        <span>听力</span>
      </button>
      <button type="button" class="tab" data-nav="quiz">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12.2 10.2 14.5 16 8.8"/><rect x="4.5" y="4.5" width="15" height="15" rx="2"/></svg>
        <span>测验</span>
      </button>
      <button type="button" class="tab" data-nav="me">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="3.2"/><path d="M5.8 19.2a6.4 6.4 0 0 1 12.4 0"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
